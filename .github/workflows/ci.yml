name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build:chrome
      - name: Cross-platform origin security test
        run: node companion/selftest-origin.mjs

  windows-helper:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Isolated localhost contract test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "headroom-isolated-server-test"
          New-Item -ItemType Directory -Path $env:USERPROFILE -Force | Out-Null
          node companion/selftest-server.mjs
      - name: Extension origin security test
        run: node companion/selftest-origin.mjs
